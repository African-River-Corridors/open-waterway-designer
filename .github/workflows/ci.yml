name: CI

on:
  # Pushes to main only: a ticket branch is tested once, by its pull request, not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older, now-stale run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches save from main only (`save-if`): a pull request's cache serves no other pull request,
# and with every PR saving its own, the repository's 10 GB cache limit evicted main's caches.
permissions:
  contents: read

# Line tables only, not full debug info, in the dev and test builds: backtraces keep their file and line,
# the build folders and the Rust caches are much smaller, so main's caches stay under the 10 GB limit
# and a pull request restores them instead of building cold. No check reads the debug info.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which parts of the tree a pull request changes. The `web-app` job below runs on a pull request only
  # when its inputs change, and always on main and by hand. `test` and `release-guard` never depend on
  # this job and always run. A skipped job does not block a merge. Three checks are required on main:
  # `test`, `release-guard` and `web-app`. The desktop app is paused (ROADMAP.md): it has no job here.
  # Weekly and slower checks (Python tests, drawing cross-check, web parity, upstream-main) are in nightly.yml.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      # On a pull request the filter reads the changed files from the API; no checkout is needed.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            web:
              - "app/**"
              - "crates/owd-core/**"
              - "crates/owd-format/**"
              - "crates/owd-cli/**"
              - "crates/owd-shell/**"
              - "crates/owd-reach/**"
              - "crates/owd-report/**"
              - "crates/owd-web/**"
              - "examples/**"
              - "tools/build_web.sh"
              - "tools/web_parity*.mjs"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh, run here in parallel parts. Each part
  # sets GATES_STEPS (and the Rust part GATES_PARTITION), so the script still checks that every step it
  # was given ran. `bash tools/gates.sh` with neither setting runs the whole gate locally, as before.
  # The job named `test` below needs every part; branch protection requires it by that name.
  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, clippy and the leftover-names check
        env:
          GATES_STEPS: fmt,clippy,oldnames
        run: bash tools/gates.sh

  # The Rust tests in N hash partitions (cargo-nextest, pinned), with Python made unusable. N = 3 by
  # measurement: the partitions take about 70-95 s of test time each, which is about as long as the
  # Python part. The slowest tests run in nightly.yml instead; see docs/agents/slow-tests.md.
  gate-rust:
    name: gate-rust (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.100
      - name: Rust tests, one partition (the doctests run in partition 1)
        env:
          GATES_STEPS: rust
          GATES_PARTITION: ${{ matrix.partition }}
        run: bash tools/gates.sh

  # The required check. It passes only when every part of the gate passed: a failed, skipped or
  # cancelled part fails it, and so does a missing or extra part.
  test:
    needs: [gate-lint, gate-rust]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '(keys == ["gate-lint", "gate-rust"]) and all(.[]; .result == "success")' >/dev/null \
            || { echo "test: a part of the gate did not pass" >&2; exit 1; }

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: PyPI can take the package (no direct dependencies once PyPI is on, from 0.4)
        run: python tools/pypi_ready.py
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # The web app (spec 0011): the web build of the front end over the wasm design session, in headless
  # Chrome. Required on main, and apart from `test`.
  web-app:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/owd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      # The prebuilt binaries (wasm-bindgen and wasm-bindgen-test-runner), checksum-verified, in seconds;
      # building them from source took about 90 s whenever the cache had lost them.
      - name: Install wasm-bindgen CLI (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wb.outputs.version }}
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build owd
        run: cargo build --release -p owd-cli
      - name: Front end (type check, desktop build, web build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:web
      - name: Web smoke test (headless Chrome)
        working-directory: app
        env:
          # The smoke test saves screenshots of the example here.
          OWD_WEB_SHOTS: ${{ runner.temp }}/web-screenshots
        run: bash e2e/run-web.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-screenshots
          if-no-files-found: ignore
